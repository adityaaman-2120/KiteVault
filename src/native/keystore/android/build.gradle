plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kitevaultkeystore'
version = '1.0.0'

android {
  namespace "expo.modules.kitevaultkeystore"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // BiometricPrompt (the system fingerprint / face dialog). Google's own library.
  implementation "androidx.biometric:biometric:1.1.0"

  testImplementation "junit:junit:4.13.2"
}
