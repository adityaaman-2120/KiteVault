# Runs on every push and on pull requests.
#
# "checks" is the main job: formatting, type-check, lint and the whole test suite with coverage
# (with the coverage limits from package.json). It needs no secrets and no Android tools.
# "kotlin-unit-tests" builds the Android project and runs the Kotlin unit tests of the local native
# module (autofill rules, vault reader, biometric policy). It is a separate job so that a problem
# with the Android toolchain on the runner is easy to tell apart from a problem in the app code.
name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes older, unfinished runs pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # "ci" installs exactly what package-lock.json says and fails if it does not match package.json.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npx eslint . --max-warnings=0

      # The argon2 tests are CPU-heavy: two workers keep the timing-sensitive screens reliable.
      - name: Tests with coverage
        run: npx jest --ci --coverage --maxWorkers=2

      - name: Coverage by area
        if: always()
        run: node scripts/coverage-report.js

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  kotlin-unit-tests:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Makes the (git-ignored) android/ project from app.json and the config plugins.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Run the Kotlin unit tests
        working-directory: android
        run: ./gradlew :keystore:testDebugUnitTest --console=plain --no-daemon

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-report
          path: src/native/keystore/android/build/reports/tests/
          retention-days: 14
